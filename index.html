<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="原子习惯">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>原子习惯</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- 左侧窄图标栏 -->
    <nav class="side-nav">
      <button class="nav-btn active" data-view="dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">概览</span>
      </button>
      <button class="nav-btn" data-view="execute">
        <span class="nav-icon">📋</span>
        <span class="nav-label">执行</span>
      </button>
      <button class="nav-btn" data-view="stats">
        <span class="nav-icon">🎮</span>
        <span class="nav-label">数值</span>
      </button>
      <button class="nav-btn" data-view="companion">
        <span class="nav-icon">💬</span>
        <span class="nav-label">陪伴</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">设置</span>
      </button>
    </nav>

    <!-- 主区域 -->
    <div class="app-main">
      <!-- 顶部栏 -->
      <header class="top-bar">
        <div class="top-bar-left">
          <h1 class="app-title" id="page-title">概览</h1>
        </div>
        <div class="top-bar-right">
          <button class="icon-btn" id="ai-remind-btn" title="和 AI 推进一件事" onclick="AIReprompt.open()">
            <span>🤖</span>
          </button>
          <button class="icon-btn" id="reminder-quick-btn" title="提醒">
            <span id="reminder-icon">🔔</span>
            <span class="badge" id="reminder-badge" style="display:none">!</span>
          </button>
        </div>
      </header>

      <!-- 主内容区 -->
      <main class="content" id="main-content">
        <!-- 各视图由 JS 动态渲染 -->
      </main>
    </div>
  </div>

  <!-- 模态框容器 -->
  <div class="modal-overlay" id="modal-overlay" style="display:none">
    <div class="modal" id="modal-container">
      <!-- 模态框内容由 JS 动态填充 -->
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
  <script src="airemind.js"></script>
</body>
</html>
